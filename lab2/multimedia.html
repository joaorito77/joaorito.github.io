<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimédia — Mogadouro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Multimédia — A minha cidade</h1>
    </header>

    <main>
      <section>
        <h2>Galeria</h2>
        <figure>
          <img src="images/mogadouro-castelo.jpg" alt="Castelo de Mogadouro" />
          <figcaption>Castelo de Mogadouro</figcaption>
        </figure>
      </section>

      <section>
        <h2>Vídeo</h2>
        <div class="video-wrapper">
          <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/yorf1sYX3WU"
            title="Roteiro por Mogadouro: História, Cultura e Natureza"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
            "
            allowfullscreen
          >
          </iframe>
        </div>
      </section>

      <section>
        <h2>Localização</h2>
        <iframe
          width="560"
          height="315"
          src="https://www.google.com/maps?q=Mogadouro,Portugal&output=embed"
          allowfullscreen
          title="Localização de Mogadouro no mapa"
        >
        </iframe>
      </section>
    </main>

    <footer>
      <p>DIW 2026</p>
    </footer>
  </body>
</html>
