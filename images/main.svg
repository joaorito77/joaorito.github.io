<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a4a"/>
      <stop offset="0.5" stop-color="#12153b"/>
      <stop offset="1" stop-color="#0d1030"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.1" cy="0.2" r="0.4">
      <stop offset="0" stop-color="#17a9c6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#17a9c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.9" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#e8375f" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e8375f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.4" cy="1" r="0.45">
      <stop offset="0" stop-color="#f4b63a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f4b63a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#g2)"/>
  <rect width="1920" height="1080" fill="url(#g3)"/>

  <!-- símbolos de código muito discretos -->
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#ffffff" fill-opacity="0.04" text-anchor="middle">
    <text x="1500" y="260" font-size="260">&lt;/&gt;</text>
    <text x="300"  y="900" font-size="300">{ }</text>
    <text x="1250" y="980" font-size="200">#</text>
  </g>

  <!-- pontos de cor -->
  <circle cx="220"  cy="180" r="8"  fill="#17a9c6" fill-opacity="0.7"/>
  <circle cx="1780" cy="820" r="10" fill="#e8375f" fill-opacity="0.7"/>
  <circle cx="960"  cy="1010" r="7" fill="#f4b63a" fill-opacity="0.7"/>
  <circle cx="1650" cy="120" r="5"  fill="#f4b63a" fill-opacity="0.6"/>
  <circle cx="140"  cy="640" r="5"  fill="#e8375f" fill-opacity="0.6"/>
</svg>
