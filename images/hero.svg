<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1030"/>
      <stop offset="0.55" stop-color="#171a4a"/>
      <stop offset="1" stop-color="#2a1b5c"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.78" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#17a9c6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#17a9c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.95" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#e8375f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8375f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1030" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#0d1030" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glowTeal)"/>
  <rect width="1920" height="1080" fill="url(#glowPink)"/>

  <!-- janela de navegador ao fundo -->
  <g transform="translate(1010 150) rotate(-6 300 200)" filter="url(#shadow)" opacity="0.85">
    <rect width="620" height="420" rx="18" fill="#1d2160"/>
    <rect width="620" height="52" rx="18" fill="#252a78"/>
    <rect y="30" width="620" height="22" fill="#252a78"/>
    <circle cx="30" cy="26" r="7" fill="#e8375f"/>
    <circle cx="54" cy="26" r="7" fill="#f4b63a"/>
    <circle cx="78" cy="26" r="7" fill="#3fbf7f"/>
    <rect x="120" y="14" width="360" height="24" rx="12" fill="#0d1030" fill-opacity="0.55"/>
    <rect x="40" y="90" width="200" height="130" rx="10" fill="#17a9c6" fill-opacity="0.35"/>
    <rect x="260" y="90" width="320" height="18" rx="9" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="260" y="122" width="260" height="12" rx="6" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="260" y="148" width="290" height="12" rx="6" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="260" y="186" width="110" height="34" rx="8" fill="#e8375f" fill-opacity="0.8"/>
    <rect x="40" y="250" width="160" height="120" rx="10" fill="#f4b63a" fill-opacity="0.25"/>
    <rect x="220" y="250" width="160" height="120" rx="10" fill="#e8375f" fill-opacity="0.25"/>
    <rect x="400" y="250" width="160" height="120" rx="10" fill="#17a9c6" fill-opacity="0.25"/>
  </g>

  <!-- janela de código à frente -->
  <g transform="translate(1180 430) rotate(4 300 220)" filter="url(#shadow)">
    <rect width="560" height="440" rx="18" fill="#0a0c26"/>
    <rect width="560" height="48" rx="18" fill="#14173d"/>
    <rect y="28" width="560" height="20" fill="#14173d"/>
    <circle cx="28" cy="24" r="6" fill="#e8375f"/>
    <circle cx="50" cy="24" r="6" fill="#f4b63a"/>
    <circle cx="72" cy="24" r="6" fill="#3fbf7f"/>

    <!-- linhas de código -->
    <g>
      <rect x="40" y="86"  width="70"  height="12" rx="6" fill="#e8375f"/>
      <rect x="122" y="86" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.35"/>

      <rect x="64" y="124" width="90"  height="12" rx="6" fill="#17a9c6"/>
      <rect x="166" y="124" width="170" height="12" rx="6" fill="#f4b63a"/>

      <rect x="64" y="162" width="60"  height="12" rx="6" fill="#17a9c6"/>
      <rect x="136" y="162" width="220" height="12" rx="6" fill="#ffffff" fill-opacity="0.30"/>

      <rect x="64" y="200" width="110" height="12" rx="6" fill="#17a9c6"/>
      <rect x="186" y="200" width="100" height="12" rx="6" fill="#e8375f"/>

      <rect x="40" y="238" width="30"  height="12" rx="6" fill="#e8375f"/>

      <rect x="40" y="290" width="80"  height="12" rx="6" fill="#e8375f"/>
      <rect x="132" y="290" width="150" height="12" rx="6" fill="#ffffff" fill-opacity="0.35"/>

      <rect x="64" y="328" width="130" height="12" rx="6" fill="#3fbf7f"/>
      <rect x="206" y="328" width="190" height="12" rx="6" fill="#f4b63a"/>

      <rect x="64" y="366" width="100" height="12" rx="6" fill="#3fbf7f"/>
      <rect x="176" y="366" width="140" height="12" rx="6" fill="#ffffff" fill-opacity="0.30"/>

      <rect x="40" y="404" width="30"  height="12" rx="6" fill="#e8375f"/>
    </g>
  </g>

  <!-- símbolo grande translúcido -->
  <text x="1560" y="330" font-family="Consolas, 'Courier New', monospace" font-size="220" font-weight="700"
        fill="#ffffff" fill-opacity="0.06" text-anchor="middle">&lt;/&gt;</text>

  <!-- pontos de cor -->
  <circle cx="1020" cy="760" r="14" fill="#f4b63a" fill-opacity="0.9"/>
  <circle cx="1100" cy="880" r="8"  fill="#17a9c6"/>
  <circle cx="1810" cy="200" r="10" fill="#e8375f"/>
  <circle cx="1720" cy="150" r="5"  fill="#f4b63a"/>
  <circle cx="900"  cy="180" r="6"  fill="#17a9c6" fill-opacity="0.8"/>

  <!-- escurece a esquerda para o texto ler-se bem -->
  <rect width="1920" height="1080" fill="url(#shade)"/>
</svg>
