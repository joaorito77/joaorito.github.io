<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 240" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b5c"/>
      <stop offset="0.5" stop-color="#171a4a"/>
      <stop offset="1" stop-color="#0d1030"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.08" cy="1" r="0.45">
      <stop offset="0" stop-color="#e8375f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8375f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.92" cy="0" r="0.45">
      <stop offset="0" stop-color="#17a9c6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#17a9c6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="240" fill="url(#bg)"/>
  <rect width="1920" height="240" fill="url(#grid)"/>
  <rect width="1920" height="240" fill="url(#glowPink)"/>
  <rect width="1920" height="240" fill="url(#glowTeal)"/>

  <!-- linha de topo em três cores -->
  <rect x="0"    y="0" width="640" height="4" fill="#e8375f"/>
  <rect x="640"  y="0" width="640" height="4" fill="#f4b63a"/>
  <rect x="1280" y="0" width="640" height="4" fill="#17a9c6"/>

  <!-- linhas de código decorativas nas laterais -->
  <g opacity="0.55">
    <rect x="60"  y="70"  width="90"  height="10" rx="5" fill="#e8375f"/>
    <rect x="162" y="70"  width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="84"  y="100" width="120" height="10" rx="5" fill="#17a9c6"/>
    <rect x="216" y="100" width="80"  height="10" rx="5" fill="#f4b63a"/>
    <rect x="60"  y="130" width="40"  height="10" rx="5" fill="#e8375f"/>

    <rect x="1620" y="70"  width="100" height="10" rx="5" fill="#3fbf7f"/>
    <rect x="1732" y="70"  width="130" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="1644" y="100" width="150" height="10" rx="5" fill="#f4b63a"/>
    <rect x="1806" y="100" width="60"  height="10" rx="5" fill="#17a9c6"/>
    <rect x="1620" y="130" width="40"  height="10" rx="5" fill="#3fbf7f"/>
  </g>

  <text x="960" y="215" font-family="Consolas, 'Courier New', monospace" font-size="120" font-weight="700"
        fill="#ffffff" fill-opacity="0.05" text-anchor="middle">&lt;/&gt;</text>
</svg>
